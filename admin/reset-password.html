<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور | الجدار الآمن للأنظمة الإلكترونية</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">

  <style>
    .reset-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top right, rgba(14, 165, 233, 0.12) 0%, #090d16 60%);
    }

    .reset-box {
      width: 100%;
      max-width: 440px;
      background: var(--adm-card);
      border: 1px solid var(--adm-border-active);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.7);
    }

    .reset-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .reset-header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.35rem;
    }

    .reset-header p {
      font-size: 0.85rem;
      color: var(--adm-text-muted);
    }

    .reset-alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    .reset-alert.error {
      display: flex;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .reset-alert.success {
      display: flex;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
  </style>
</head>
<body>

  <div class="reset-wrapper">
    <div class="reset-box">
      
      <div style="text-align: center; font-size: 2.2rem; color: var(--adm-accent); margin-bottom: 1rem;">
        <i class="fa-solid fa-key"></i>
      </div>

      <div class="reset-header">
        <h1>إعادة تعيين كلمة المرور</h1>
        <p>أدخل كلمة المرور الجديدة لحساب الإدارة الخاص بك</p>
      </div>

      <div id="resetAlert" class="reset-alert"></div>

      <form id="resetForm" novalidate>
        
        <div style="margin-bottom: 1.25rem;">
          <label class="form-label" for="newPassword">كلمة المرور الجديدة</label>
          <input type="password" id="newPassword" class="form-input" placeholder="••••••••••••" required style="direction: ltr;">
          <small style="color: var(--adm-text-muted); font-size: 0.75rem; display: block; margin-top: 0.25rem;">8 خانات على الأقل (أرقام وأحرف)</small>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label class="form-label" for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••••••" required style="direction: ltr;">
        </div>

        <button type="submit" class="btn-adm btn-adm-primary" style="width: 100%; padding: 0.85rem;" id="submitResetBtn">
          <i class="fa-solid fa-check"></i>
          <span>حفظ كلمة المرور الجديدة</span>
        </button>

      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.825rem;">
        <a href="login.html" style="color: var(--adm-accent); text-decoration: none;">
          <i class="fa-solid fa-arrow-left"></i> العودة لتسجيل الدخول
        </a>
      </div>

    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const alertBox = document.getElementById('resetAlert');
    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitResetBtn');

    if (!token) {
      showAlert('رابط إعادة التعيين غير صالح أو منتهي الصلاحية.', 'error');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword || newPassword.length < 8) {
        showAlert('كلمة المرور يجب ألا تقل عن 8 خانات.', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showAlert('كلمتا المرور غير متطابقتين.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحديث...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showAlert('تم تحديث كلمة المرور بنجاح! جاري تحويلك لصفحة تسجيل الدخول...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showAlert(data.message || 'فشل إعادة التعيين، قد يكون الرابط منتهي الصلاحية.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> حفظ كلمة المرور الجديدة';
        }
      } catch (err) {
        showAlert('حدث خطأ بالاتصال، يرجى المحاولة لاحقاً.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> حفظ كلمة المرور الجديدة';
      }
    });

    function showAlert(msg, type) {
      alertBox.className = `reset-alert ${type}`;
      alertBox.innerHTML = type === 'error'
        ? `<i class="fa-solid fa-circle-exclamation"></i> <span>${msg}</span>`
        : `<i class="fa-solid fa-circle-check"></i> <span>${msg}</span>`;
      alertBox.style.display = 'flex';
    }
  </script>
</body>
</html>
